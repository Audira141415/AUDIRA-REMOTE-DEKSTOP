<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Dual Monitor Horizon -->
    <linearGradient id="screenBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(0,240,255,0.3)" stroke-width="2.5"/>

  <!-- Desktop Monitor Frame -->
  <rect x="22" y="24" width="84" height="56" rx="8" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" filter="url(#neonGlow)"/>

  <!-- Monitor Stand Base -->
  <path d="M52 80 L48 94 L80 94 L76 80 Z" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="3"/>
  <rect x="42" y="94" width="44" height="4" rx="2" fill="url(#screenBeam)"/>

  <!-- Stylized "A" Monogram Bridge -->
  <!-- Left Leg -->
  <path d="M38 72 L58 34 L66 34 L46 72 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
  <!-- Right Leg -->
  <path d="M62 34 L70 34 L90 72 L82 72 Z" fill="url(#emeraldGrad)" filter="url(#neonGlow)"/>

  <!-- High-Speed Lightning Vector / Screen Connector Crossbar -->
  <path d="M34 56 L88 48 L76 60 L96 52 L54 62 Z" fill="url(#cyanGrad)"/>

  <!-- Core Pulse Nodes -->
  <circle cx="64" cy="35" r="3.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="42" cy="72" r="3" fill="#00F0FF"/>
  <circle cx="86" cy="72" r="3" fill="#10B981"/>
</svg>
