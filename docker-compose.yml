services:
  hbbs:
    container_name: audira-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r desk.audira.my.id:21117
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: always
    depends_on:
      - hbbr

  hbbr:
    container_name: audira-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: always

  web:
    container_name: audira-remote-web
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "5050:5050"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
